[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendkit"
version = "0.1.0"
description = "Statistical core for detecting trends in Earth-system time series (NASA Space Apps 2026)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pandas", "xarray"]

[project.optional-dependencies]
dev = ["pytest", "statsmodels", "pymannkendall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
