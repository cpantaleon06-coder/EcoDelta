[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecodelta_engine"
version = "0.1.0"
description = "EcoDelta engine: screens NASA-derived Earth system variables by region and exports web-ready JSON (NASA Space Apps 2026)."
readme = "README.md"
requires-python = ">=3.12"
# trendkit is a sibling project, install it first: pip install -e ../trendkit
dependencies = ["trendkit", "xarray", "netCDF4", "numpy", "pandas", "scipy", "pyyaml", "jsonschema"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
