# Named regions as latitude/longitude boxes (degrees; longitude -180..180).
# These are approximate boxes, NOT political borders: a box includes parts of neighbouring
# countries and ocean, and some boxes overlap (for example Western Europe and Mediterranean).
# A cell belongs to a box when its center lies inside it (edges inclusive).
# phrase: how the region reads inside a sentence (defaults to name).
# box: [lat_min, lat_max, lon_min, lon_max]; lon_min > lon_max would mean the box crosses 180.

